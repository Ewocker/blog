name: Notify Blog Preview

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  statuses: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # Only run for blog post PRs (created by blog-publisher skill)
    if: contains(github.event.pull_request.body, 'blog-publisher skill')
    steps:
      # Netlify reports the deploy preview as a commit status named
      # netlify/<site>/deploy-preview whose target_url is the preview URL.
      # Polling that status needs only the default GITHUB_TOKEN, so no
      # Netlify site id or token is required here.
      - name: Wait for Netlify deploy preview
        id: netlify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MAX_WAIT_SECONDS: "600"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
          while :; do
            line=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '.statuses[] | select(.context | test("^netlify/.*/deploy-preview$")) | "\(.state) \(.target_url)"' \
              | head -n 1 || true)
            state=${line%% *}
            url=${line#* }
            case "$state" in
              success)
                echo "url=$url" >> "$GITHUB_OUTPUT"
                echo "Deploy preview ready: $url"
                exit 0
                ;;
              failure|error)
                echo "::error::Netlify deploy preview reported state '$state'"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${MAX_WAIT_SECONDS}s waiting for the Netlify deploy preview status"
              exit 1
            fi
            sleep 15
          done

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[Blog Preview] ${{ github.event.pull_request.title }}"
          to: chockerlin@gmail.com
          from: "Blog Publisher <${{ secrets.GMAIL_USERNAME }}>"
          body: |
            A new blog post is ready for review!

            **Title:** ${{ github.event.pull_request.title }}

            **Preview URL:** ${{ steps.netlify.outputs.url }}

            **Pull Request:** ${{ github.event.pull_request.html_url }}

            ---
            Review the preview and merge the PR to publish.
